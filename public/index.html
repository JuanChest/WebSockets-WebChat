<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPN FIS Chat WebSocket</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="chat-container">
      <!-- Encabezado del Chat -->
      <header class="chat-header">
        <div class="header-left">
          <div class="chat-avatar" aria-hidden="true">TG</div>
          <div class="header-info">
            <div class="header-title-row">
              <h1 class="chat-title">Sala General EPN FIS</h1>
            </div>
            <div class="header-meta">
              <span id="statusBadge" class="status-pill disconnected" role="status" aria-live="polite">
                <span class="status-dot"></span>
                <span id="statusText">Desconectado</span>
              </span>
              <span class="users-badge" title="Usuarios conectados actualmente">
                <span>👥</span>
                <span id="userCountText">0 en línea</span>
              </span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <span id="currentUserBadge" class="current-user-chip" title="Tu nombre de usuario"></span>

          <button type="button" id="themeToggleBtn" class="icon-btn" title="Cambiar modo claro / oscuro" aria-label="Cambiar modo claro u oscuro">
            <span id="themeIcon" aria-hidden="true">🌙</span>
            <span id="themeLabel" class="btn-label-desktop">Oscuro</span>
          </button>

          <button type="button" id="logoutBtn" class="icon-btn" title="Salir y cambiar de usuario" aria-label="Salir del chat">
            <span aria-hidden="true">🚪</span>
            <span class="btn-label-desktop">Salir</span>
          </button>
        </div>
      </header>

      <!-- Área de Mensajes -->
      <section id="messagesArea" class="messages-area" aria-live="polite" aria-label="Historial de mensajes">
        <div class="message-row system">
          <div class="system-pill">Bienvenido al chat en tiempo real. Los mensajes se envían en formato JSON.</div>
        </div>
      </section>

      <!-- Barra de Estado: Indicador "escribiendo..." y avisos de validación -->
      <div class="status-bar-container">
        <div id="feedbackBanner" class="feedback-banner" role="alert">
          <span id="feedbackText"></span>
        </div>

        <div id="typingIndicator" class="typing-indicator" aria-live="polite">
          <div class="typing-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span id="typingText"></span>
        </div>
      </div>

      <!-- Barra de Composición de Mensajes -->
      <form id="messageForm" class="chat-composer" novalidate>
        <div class="composer-row">
          <div class="composer-input-wrap">
            <input
              type="text"
              id="messageInput"
              class="message-input"
              placeholder="Escribe un mensaje..."
              autocomplete="off"
              aria-label="Escribe un mensaje"
            >
            <span id="charCounter" class="char-counter">0 / 500</span>
          </div>

          <button type="submit" id="sendBtn" class="send-btn" title="Enviar mensaje" aria-label="Enviar mensaje" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="chat.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar al Chat - EPN FIS WebSocket</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-wrapper">
    <div class="login-top-bar">
      <button type="button" id="themeToggleBtn" class="icon-btn" aria-label="Cambiar tema claro u oscuro">
        <span id="themeIcon" aria-hidden="true">🌙</span>
        <span id="themeLabel">Modo oscuro</span>
      </button>
    </div>

    <section class="login-card" aria-labelledby="loginHeading">
      <div class="telegram-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"></path>
          <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
        </svg>
      </div>

      <h1 id="loginHeading" class="login-title">EPN FIS Chat</h1>
      <p class="login-subtitle">
        Ingresa tu nombre de usuario para conectarte a la sala de chat en tiempo real.
      </p>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="usernameInput" class="form-label">Nombre de usuario</label>
          <input
            type="text"
            id="usernameInput"
            class="form-input"
            placeholder="Ej. JuanPerez"
            autocomplete="nickname"
            autofocus
            required
          >
          <div class="form-helper">
            <span>Entre 2 y 25 caracteres</span>
            <span id="usernameCharCount">0 / 25</span>
          </div>
          <p id="loginError" class="error-text" role="alert" aria-live="polite"></p>
        </div>

        <button type="submit" id="connectBtn" class="btn-primary">
          <span>Conectarse al Chat</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
